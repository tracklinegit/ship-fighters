<script>
'use strict';
const VERSION='1.4.0',SAVE_KEY='neon-wing-v1';

const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),hyp=Math.hypot,cl=(v,a,b)=>Math.max(a,Math.min(b,v)),dz=v=>Math.abs(v)<.2?0:v,wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a)),mod=(v,n)=>((v%n)+n)%n;
const FONT="'Trebuchet MS','Century Gothic',system-ui,sans-serif";

// ---------- saved data (scores and settings), always safe to fail ----------
const save={hs:[],set:{master:7,music:6,sfx:8,shake:2,fps:0}};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s&&typeof s==='object'){if(Array.isArray(s.hs))save.hs=s.hs.filter(h=>h&&isFinite(h.s)&&isFinite(h.w)).slice(0,5);if(s.set&&typeof s.set==='object')for(const k in save.set)if(isFinite(s.set[k]))save.set[k]=+s.set[k]}}catch(e){}

const SET=save.set;
save.cu={hull:1,col:0,trail:0,emb:0,abil:0,name:0};save.st={kills:0,bosses:0,wave:0,score:0};save.dy={d:'',s:0};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s)for(const g of['cu','st','dy'])if(s[g]&&typeof s[g]==='object')for(const k in save[g]){const v=s[g][k];if(typeof save[g][k]==='string'){if(typeof v==='string')save[g][k]=v.slice(0,12)}else if(v!==null&&isFinite(v))save[g][k]=+v}}catch(e){}

// ---------- input ----------
const keys={},mouse={x:W/2,y:H/2,down:false,moved:false};
addEventListener('keydown',e=>{keys[e.code]=true;initAudio();if(e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=false);

cv.addEventListener('mousedown',()=>{mouse.down=true;initAudio()});addEventListener('mouseup',()=>mouse.down=false);
const fs=()=>{try{document.fullscreenElement?document.exitFullscreen():cv.requestFullscreen()}catch(e){}};cv.addEventListener('dblclick',fs);
const pv={};const ed=(k,c)=>{const r=!!c&&!pv[k];pv[k]=!!c;return r};
addEventListener('gamepadconnected',e=>{try{msg='CONTROLLER CONNECTED';msgT=2}catch(_){}});
addEventListener('gamepaddisconnected',e=>{if(state==='play'&&ps.some(p=>p.pi===e.gamepad.index))state='disc'});
const autoPause=()=>{if(state==='play'){state='pause';menuSel=0}};
document.addEventListener('visibilitychange',()=>{if(document.hidden){autoPause();if(AC&&AC.state==='running')AC.suspend()}else if(AC)AC.resume()});
addEventListener('blur',autoPause);

// ---------- audio: three buses (master, music, effects), all synthesized ----------
let AC,NB,beamG,muted=false,step=0;const bus={};const vol=k=>cl(+SET[k]||0,0,10)/10;
function applyVol(){if(!AC)return;bus.m.gain.value=muted?0:vol('master');bus.mu.gain.value=vol('music')*.7;bus.sx.gain.value=vol('sfx')}
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return}
 try{AC=new(window.AudioContext||window.webkitAudioContext)();bus.m=AC.createGain();bus.mu=AC.createGain();bus.sx=AC.createGain();bus.mu.connect(bus.m);bus.sx.connect(bus.m);bus.m.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const o=AC.createOscillator(),f=AC.createBiquadFilter();beamG=AC.createGain();o.type='sawtooth';o.frequency.value=110;f.type='lowpass';f.frequency.value=900;beamG.gain.value=0;o.connect(f);f.connect(beamG);beamG.connect(bus.sx);o.start();
  applyVol();seq()}catch(e){AC=null}}
function tone(f,d,type='square',v=.3,sl=0,dest){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+sl),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(dest||bus.sx);o.start(n);o.stop(n+d)}
function noise(d,f,v){if(!AC||muted)return;const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain(),n=AC.currentTime;s.buffer=NB;fl.type='lowpass';fl.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);s.connect(fl);fl.connect(g);g.connect(bus.sx);s.start(n);s.stop(n+d)}
function seq(){const root=[55,55,65.4,49],sc=[1,1.2,1.5,1.8,2,2.4];
 const tick=()=>{try{if(AC&&!muted&&(state==='play'||state==='title'||state==='upgrade')){const b=root[(step>>3)%4],bo=en.some(e=>e.k==='boss');
  if(step%2===0)tone(b,.22,'sawtooth',.12,0,bus.mu);if(step%4===0&&state!=='upgrade')tone(b*4*sc[(Math.random()*6)|0],.3,'triangle',.07,0,bus.mu);if(bo&&step%2===1)tone(b*2,.1,'square',.06,0,bus.mu);step++}}catch(e){}
  setTimeout(tick,en.some(e=>e.k==='boss')?125:165)};tick()}
const SFX={shot:()=>tone(880,.06,'square',.06,-500),eshot:()=>tone(300,.08,'sawtooth',.05,-150),boom:()=>{noise(.45,1400,.5);tone(80,.4,'sawtooth',.3,-50)},pop:()=>noise(.15,2500,.25),hit:()=>tone(200,.05,'triangle',.15,-80),
 shield:()=>tone(1200,.12,'sine',.2,-700),hurt:()=>{tone(110,.3,'sawtooth',.35,-60);noise(.12,900,.3)},pick:()=>{tone(600,.08,'square',.15);setTimeout(()=>tone(900,.1,'square',.15),70)},
 up:()=>{[440,550,660,880].forEach((f,i)=>setTimeout(()=>tone(f,.12,'square',.15),i*70))},wave:()=>{tone(330,.15);setTimeout(()=>tone(495,.2),130)},boss:()=>{tone(55,1,'sawtooth',.5,-20);setTimeout(()=>tone(55,1,'sawtooth',.5,-20),600)},click:()=>tone(700,.04,'square',.1)};
const sfx=k=>{try{SFX[k]()}catch(e){}};

// ---------- data ----------
const itm=(n,u,t,o)=>Object.assign({n,u:u||(()=>1),t:t||''},o);
const HULLS=[itm('Interceptor',0,0,{d:'Fast and agile, light armor',spd:1.15,sh:-15,hp:-20,dmg:1,beam:1,shp:[[20,0],[-12,-8],[-6,0],[-12,8]]}),
 itm('Striker',0,0,{d:'Balanced all-rounder with a stronger beam',spd:1,sh:0,hp:0,dmg:1,beam:1.25,shp:[[18,0],[-12,-12],[-6,0],[-12,12]]}),
 itm('Gunship',()=>save.st.wave>=5,'Reach wave 5',{d:'Slow and tough, heavier blaster',spd:.88,sh:25,hp:30,dmg:1.15,beam:1,shp:[[16,0],[2,-16],[-14,-14],[-8,0],[-14,14],[2,16]]}),
 itm('Phantom',()=>save.st.score>=15000,'Score 15000 in one run',{d:'Quick and fragile, recharges energy fast',spd:1.08,sh:0,hp:-10,dmg:1,beam:1.1,er:1.5,shp:[[20,0],[-4,-14],[-16,-6],[-8,0],[-16,6],[-4,14]]})];
const COLS=[['Cyan','#38f6ff'],['Magenta','#ff4fd8'],['Lime','#b6ff3b'],['Gold','#ffd166']].map(([n,c])=>itm(n,0,0,{c})).concat([['Violet','#8c5aff',100],['Ember','#ff7a45',300],['White','#ffffff',600]].map(([n,c,k])=>itm(n,()=>save.st.kills>=k,'Defeat '+k+' enemies',{c})));
const TRAILS=[itm('Comet'),itm('Sparkle'),itm('Ribbon',()=>save.st.wave>=8,'Reach wave 8'),itm('Ember',()=>save.st.bosses>=1,'Defeat a capital ship')];

const ABIL=[itm('Dash',0,0,{d:'Burst of speed with brief invulnerability',cd:6}),itm('EMP pulse',()=>save.st.kills>=40,'Defeat 40 enemies',{d:'Wipes nearby enemy fire and stuns enemies',cd:12}),itm('Shield burst',()=>save.st.wave>=3,'Reach wave 3',{d:'Refills your shield and shoves enemies away',cd:14})];
const NAMES=['PILOT','ACE','NOVA','VIPER','ECHO','RAVEN','COMET','HAWK','GHOST','BLAZE'].map(n=>itm(n));
const CU=[['hull',HULLS,'Hull'],['col',COLS,'Color'],['trail',TRAILS,'Trail'],['emb',EMBS,'Emblem'],['abil',ABIL,'Ability'],['name',NAMES,'Callsign']];
const ucount=()=>[HULLS,COLS,TRAILS,EMBS,ABIL].reduce((n,a)=>n+a.filter(x=>x.u()).length,0);
const DMODS=[{n:'Swarm day'},{n:'Armored day'},{n:'Glass cannon'}];
const today=()=>new Date().toISOString().slice(0,10),seedOf=()=>[...today()].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);

let SR=Math.random;const gr=()=>daily?SR():Math.random(),shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(gr()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ET={fighter:{r:16,hp:()=>3+Math.floor(wave/3),sp:260,sc:100,c:'#ff9f43'},swarm:{r:9,hp:()=>1.5,sp:380,sc:40,c:'#b6ff3b'},boss:{r:90,hp:()=>(90+wave*15)*(ps.length>1?1.5:1),sp:70,sc:2000,c:'#ff3b5c'},guard:{r:22,hp:()=>8+Math.floor(wave/2),sp:150,sc:250,c:'#6ee7b7'},sniper:{r:14,hp:()=>3,sp:200,sc:200,c:'#c084fc'},minelayer:{r:20,hp:()=>6,sp:110,sc:220,c:'#fbbf24'}};
const SH={player:[[18,0],[-12,-12],[-6,0],[-12,12]],fighter:[[16,0],[-10,-11],[-4,0],[-10,11]],swarm:[[10,0],[-7,-6],[-7,6]],boss:[[100,0],[60,-35],[20,-70],[-60,-60],[-90,-30],[-100,0],[-90,30],[-60,60],[20,70],[60,35]],guard:[[22,0],[11,-19],[-11,-19],[-22,0],[-11,19],[11,19]],sniper:[[22,0],[-8,-6],[-14,0],[-8,6]],minelayer:[[16,0],[8,-14],[-12,-10],[-16,0],[-12,10],[8,14]]};
const UPG=[['Overcharged blaster','+25% blaster damage',()=>U.dmg*=1.25,()=>1],['Rapid cycler','+20% fire rate',()=>U.rate*=1.2,()=>1],['Twin cannons','Fire an extra shot (up to 3)',()=>U.shots++,()=>U.shots<3],
 ['Focused beam','+30% beam damage',()=>U.beam*=1.3,()=>1],['Efficient capacitor','Beam and boost use 20% less energy',()=>U.eff*=.8,()=>1],['Deflector grid','+25 max shield',()=>U.shield+=25,()=>1],
 ['Hull plating','+30 max hull and repair 30',()=>{U.hull+=30;for(const p of ps)p.hull=Math.min(MH(p),p.hull+30)},()=>1],['Ion engines','+12% speed and turning',()=>U.speed*=1.12,()=>1],['Salvage drones','Enemies drop more pickups',()=>U.drop+=.06,()=>1]];
let state='loading',t=0,pads=[],ps=[],bul=[],eb=[],en=[],parts=[],drops=[],choices=[],sel=1,upT=0,overT=0,U={},wave=0,score=0,combo=0,comboT=0,spawnQ=[],spawnT=0,banner=0,shake=0,flash=0,menuSel=0,setBack='title',confirmReset=false,newHS=false,loadP=0,fps=60,errs=0,dead=false;
const cam={x:0,y:0};let layers=[],neb=null,rocks=[],bh=null,mines=[],drn=[],daily=0,dmod=0,msg='',msgT=0,brow={},u0=0,newU=false;
function mkCu(i){const c=i?{hull:1,col:1,trail:0,emb:0,abil:0}:save.cu,ok=(a,k,f)=>a[c[k]]&&a[c[k]].u()?a[c[k]]:a[f||0];
 return{h:daily?HULLS[1]:ok(HULLS,'hull',1),col:ok(COLS,'col').c,trail:ok(TRAILS,'trail').n,emb:ok(EMBS,'emb').n,ab:daily?ABIL[0]:ok(ABIL,'abil')}}
const MH=p=>U.hull+p.cu.h.hp,MS=p=>U.shield+p.cu.h.sh;
const mkP=(i,pi)=>{const cu=mkCu(i);return{i,pi,cu,x:i*60,y:0,vx:0,vy:0,a:-Math.PI/2,hull:(U.hull||100)+cu.h.hp,shield:(U.shield||50)+cu.h.sh,sht:0,en:100,alive:true,fire:0,inv:0,col:cu.col,pv:{},beam:false,boost:false,ab:0,dn:0,revive:0}};
const near=o=>{let b=null,m=1e9;for(const p of ps)if(p.alive){const d=hyp(p.x-o.x,p.y-o.y);if(d<m){m=d;b=p}}return b||ps[0]};
const ctr=()=>{let x=0,y=0,n=0,vx=0,vy=0;for(const p of ps)if(p.alive){x+=p.x;y+=p.y;vx+=p.vx;vy+=p.vy;n++}return n?{x:x/n,y:y/n,vx:vx/n,vy:vy/n}:{x:cam.x,y:cam.y,vx:0,vy:0}};

// ---------- run setup ----------
function reset(){U={dmg:1,rate:1,shots:1,beam:1,eff:1,shield:50,hull:100,speed:1,drop:.07};if(daily){const sd=seedOf();SR=mul(sd);dmod=sd%3;if(dmod===2){U.dmg=2;U.hull=50}}const g=pads[0];ps=[mkP(0,g?g.index:-1)];bul=[];eb=[];en=[];parts=[];drops=[];rocks=[];bh=null;mines=[];drn=[];msgT=0;score=0;combo=0;comboT=0;wave=0;cam.x=0;cam.y=0;shake=0;flash=0;newHS=false;nextWave()}
function startRun(d){daily=d?1:0;initAudio();u0=ucount();reset();state='play';msg=coopMode?'CO-OP READY - second pilot can join':'FLY SOLO OR PRESS A BUTTON ON A SECOND CONTROLLER';msgT=3}
function nextWave(){wave++;banner=2.5;save.st.wave=Math.max(save.st.wave,wave);const c=ctr();for(const p of ps){if(!p.alive){p.alive=true;p.hull=MH(p)/2;p.x=c.x+rnd(-40,40);p.y=c.y}p.hull=Math.min(MH(p),p.hull+25);p.shield=MS(p);p.en=100;p.dn=0}mines=[];bh=(wave>=4&&wave%2===0&&wave%5!==0)?(()=>{const a=rnd(0,TAU),d=rnd(550,800);return{x:c.x+Math.cos(a)*d,y:c.y+Math.sin(a)*d,life:30}})():null;
 spawnQ=[];const co=ps.length>1?2:0;for(let i=0;i<2+wave+co;i++)spawnQ.push({k:'fighter'});if(wave>=3)for(let i=0;i<Math.floor(wave/3);i++)spawnQ.push({k:'guard'});if(wave>=4)for(let i=0;i<Math.floor(wave/4);i++)spawnQ.push({k:'sniper'});if(wave>=5)for(let i=0;i<1+Math.floor((wave-5)/4);i++)spawnQ.push({k:'minelayer'});if(daily&&dmod===0)spawnQ.push({k:'swarm',n:5+wave});
 if(wave>=2)spawnQ.push({k:'swarm',n:4+wave+co});if(wave>=6)spawnQ.push({k:'swarm',n:4+wave});
 shuf(spawnQ);if(wave%5===0)spawnQ=[{k:'fighter'},{k:'fighter'},{k:'boss'}];
 spawnT=2;sfx(wave%5===0?'boss':'wave')}
function spawnE(k,x,y){const d=ET[k],hp=d.hp()*(daily&&dmod===1?1.4:1)*(ps.length>1?1.45:1);en.push({k,x,y,vx:0,vy:0,a:rnd(0,TAU),r:d.r,hp,mhp:hp,sp:d.sp,fc:rnd(.5,1.8),fl:0,t1:2,t2:8,sa:0,sg:Math.random()<.5?1:-1,ph:rnd(0,TAU)})}
function spawnItem(it){const p=near({x:cam.x,y:cam.y}),a=rnd(0,TAU),d=rnd(850,1000),x=p.x+Math.cos(a)*d,y=p.y+Math.sin(a)*d;
 if(it.k==='swarm')for(let i=0;i<it.n;i++)spawnE('swarm',x+rnd(-70,70),y+rnd(-70,70));else spawnE(it.k,x,y)}

// ---------- effects and damage ----------
const sk=a=>{shake=Math.max(shake,a*[0,.4,1][SET.shake|0])};
function spark(x,y,n,c,sp,s=2){if(parts.length>450)return;for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(sp*.2,sp),l=rnd(.25,.7);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:l,max:l,c,s:rnd(1,s+1)})}}
function boom(x,y,r,c){parts.push({k:'ring',x,y,vx:0,vy:0,life:.5,max:.5,c,s:r*1.6});spark(x,y,10+r/2|0,c,260+r*2,3)}
function rum(p,m,ms){try{const g=p.pi>=0&&pads.find(q=>q.index===p.pi);if(g&&g.vibrationActuator)g.vibrationActuator.playEffect('dual-rumble',{duration:ms,strongMagnitude:m,weakMagnitude:m}).catch(()=>{})}catch(e){}}
function gameOver(){state='over';menuSel=0;overT=0;const e={s:score,w:wave};save.hs.push(e);save.hs.sort((a,b)=>b.s-a.s);save.hs=save.hs.slice(0,5);newHS=save.hs[0]===e&&score>0;save.st.score=Math.max(save.st.score,score);if(daily&&score>(save.dy.d===today()?save.dy.s:0))save.dy={d:today(),s:score};newU=ucount()>u0;persist()}
function dmgP(p,d){if(!p.alive||p.inv>0)return;p.inv=.4;p.sht=0;combo=0;

 if(p.hull<=0){p.alive=false;p.dn=ps.length>1?10:0;p.revive=0;boom(p.x,p.y,40,p.col);sfx('boom');sk(18);if(ps.length===1)gameOver()}}
function killE(e){const d=ET[e.k];save.st.kills++;if(e.k==='boss')save.st.bosses++;score+=Math.round(d.sc*(1+Math.min(4,Math.floor(combo/10)))*(daily&&dmod===1?1.4:1));combo++;comboT=3;boom(e.x,e.y,e.r,d.c);
 if(e.k==='boss'){sfx('boom');sk(22);flash=.8;for(let i=0;i<3;i++)drops.push({x:e.x+rnd(-60,60),y:e.y+rnd(-60,60),k:['hull','energy','shield'][i],life:20})}
 else{sfx('pop');sk(e.k==='fighter'?3:1);if(Math.random()<U.drop)drops.push({x:e.x,y:e.y,k:['hull','energy','shield'][Math.random()*3|0],life:10})}}
const eshot=(x,y,a,s,d)=>{eb.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:3,dmg:d});sfx('eshot')};

// ---------- controls ----------
function navIn(){const a=f=>pads.some(f),b=(g,i)=>g.buttons[i]&&g.buttons[i].pressed;
 return{l:ed('l',keys.ArrowLeft||keys.KeyA||a(g=>g.axes[0]<-.6||b(g,14))),r:ed('r',keys.ArrowRight||keys.KeyD||a(g=>g.axes[0]>.6||b(g,15))),
  u:ed('u',keys.ArrowUp||keys.KeyW||a(g=>g.axes[1]<-.6||b(g,12))),d:ed('d',keys.ArrowDown||keys.KeyS||a(g=>g.axes[1]>.6||b(g,13))),
  ok:ed('ok',keys.Space||keys.Enter||a(g=>b(g,0)||b(g,9))),click:ed('click',mouse.down),back:ed('back',keys.Escape||keys.Backspace||a(g=>b(g,1)))}}
// Gamepad API reader: normalises standard (PS5/Xbox) and non-standard layouts.
function readPad(g){
 const std=g.mapping==='standard',ax=i=>g.axes[i]||0,bt=i=>!!(g.buttons[i]&&g.buttons[i].pressed),bv=i=>g.buttons[i]?g.buttons[i].value:0;

 else{overT+=dt;const items=MENUS[state]?MENUS[state]():[];const y0=state==='settings'?210:state==='over'?470:state==='pause'?290:300;
  if(state==='over'&&overT<.6){}else{
   if(mouse.moved){const i=Math.floor((mouse.y-y0+20)/60);if(i>=0&&i<items.length)menuSel=i;mouse.moved=false}
   if(n.u)menuSel=(menuSel+items.length-1)%items.length;if(n.d)menuSel=(menuSel+1)%items.length;
   if(items[menuSel]){if(n.l)items[menuSel].a(-1);else if(n.r)items[menuSel].a(1);else if(n.ok||n.click)items[menuSel].a(0)}
   if(n.back){if(state==='settings')go(setBack==='pause'?'pause':'title');else if(state==='pause')state='play'}}}
 draw()}
function fatal(e){dead=true;console.error(e);const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#05060f;color:#e8f6ff;font:18px system-ui';
 d.innerHTML='<div style="font-size:28px">Something went wrong</div><div style="opacity:.7;max-width:520px;text-align:center">The game hit an unexpected error. Your saved scores are safe.</div>';
 const b=document.createElement('button');b.textContent='Reload game';b.style.cssText='padding:10px 22px;font-size:18px;border:2px solid #38f6ff;background:transparent;color:#38f6ff;border-radius:8px;cursor:pointer';b.onclick=()=>location.reload();d.appendChild(b);document.body.appendChild(d)}
function frame(ts){if(dead)return;try{tick(ts);errs=0}catch(e){errs++;console.error(e);if(errs>=3){fatal(e);return}}requestAnimationFrame(frame)}
addEventListener('error',e=>{if(!dead&&errs>=2)fatal(e.error)});
requestAnimationFrame(frame);
